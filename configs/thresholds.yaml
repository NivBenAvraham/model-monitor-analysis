metrics:
  temperature:

    ambient_stability:              # R1
      cv_threshold: 0.55            # AMBIENT_CV_MED  — primary pass/fail boundary
      cv_high:      0.70            # AMBIENT_CV_HIGH — severe instability veto (~top 5%)

    ambient_range:                  # R2 — recalibrated 2026-04-26 (anchor sets)
      min_celsius:  5.0             # was 2.0 — perfect-valid min was 5.12; one perfect-invalid (0.75) below
      max_celsius: 50.0             # unchanged — anchors don't suggest tightening

    bucket_reference_adherence:     # R3 — recalibrated 2026-04-26 (anchor sets)
      # Per-bucket reference temperature bands. Recalibrated against perfect-example anchors:
      #   - large.low 28→33.9  : CLEAN GAP between 14 perfect-valid (≥33.95) and 5 perfect-invalid (≤33.45)
      #   - medium.low 26→27.3 : catches 4/5 perfect-invalids; perfect-valid min was 27.36
      #   - small.low 23→17.4  : LOOSENED — perfect-valid min was 17.5 (analyst expanded the small range)
      #   - .high values unchanged — perfect-invalids cluster on the LOW side, not HIGH
      small:
        low:  17.4                  # was 23.0 — perfect-valid min was 17.5
        high: 29.0
      medium:
        low:  27.3                  # was 26.0 — perfect-valid min was 27.36; catches 4/5 perfect-invalids
        high: 32.0
      large:
        low:  33.9                  # was 28.0 — CLEAN SEPARATION; catches 5/5 perfect-invalids
        high: 35.0

    sensor_spread_within_bucket:    # R4 — recalibrated 2026-04-26 (anchor sets) → per-bucket
      # Was a single threshold (5.0°C) applied uniformly across small/medium/large.
      # Anchor analysis showed:
      #   - large bucket has tight spread for valid (0.32–1.00) vs invalid (1.10–2.63) → CLEAN GAP @ 1.05
      #   - medium/small have naturally wider spread for valids → use loose per-bucket caps
      # Schema is now per-bucket:
      small:  8.0                   # loose — perfect-valid up to 7.55; perfect-invalid up to 9.13
      medium: 8.0                   # loose — perfect-valid up to 7.12 (no clean separation)
      large:  1.05                  # CLEAN SEPARATION; catches 5/5 perfect-invalids

    bucket_temporal_stability:      # R5 — re-tightened 2026-04-26 against new anchors
      small_std_max:  2.0           # was 2.5 — perfect-valid up to 1.82; catches 2/5 perfect-invalids
      medium_std_max: 0.95          # was 2.0 — perfect-valid up to 0.92; catches 3/5 perfect-invalids
      large_std_max:  0.20          # was 2.5 — perfect-valid up to 0.14; catches 4/5 perfect-invalids

    bucket_diurnal_amplitude:       # R7 — added 2026-04-27 (analyst-anchor calibration)
      # Mean of daily (max−min) of the hourly bucket-mean. Catches "fake large/medium"
      # hives that swing too widely across each 24h cycle (R5 misses this — see module docstring).
      # Calibrated against perfect-anchor sets:
      #   large : perfect-valid max +10.55, perfect-invalid min +17.37 → CLEAN GAP @ 14.0
      #   medium: kept loose at 25 (perfect-valid max +20.6 but broader-train valids can exceed 21)
      #   small : kept loose at 40 (small hives naturally track ambient widely)
      small:  40.0
      medium: 25.0
      large:  14.0

    large_bucket_sensor_divergence: # R8 — added 2026-05-18 (temperature-drop investigation)
      # Max daily std of per-sensor daily means within the large bucket.
      # Captures "some sensors plunge while others hold" events inside the large bucket.
      # Calibrated on train split (423 pairs):
      #   valid   max 3.50 °C (outlier group 47); 75th pct 0.71; mean 0.64
      #   invalid max 5.25 °C (group 1144); top 3 invalids: 5.25, 3.40, 3.08
      #   → threshold 3.0 °C: catches 3 extreme invalids, flags 2 valid outliers
      # Not a universal separator — a niche metric for the most extreme drop events.
      # Medium is informational only — does NOT affect pass_metric.
      large:  3.0
      medium: 6.0

    bucket_temperature_ordering:    # R6c — mandatory gate in decision rule
      min_gap_celsius: 1.5          # unchanged — anchors don't suggest tightening

    small_hive_ambient_tracking:    # R6a
      min_correlation: 0.3

    large_hive_thermoregulation:    # R6b
      max_correlation: 0.85

decision:
  temperature_health_rule:
    # Layer 1 sensor_group_segment gate
    l1_min_pass_rate: 0.85

    # Hard gates (failing any → INVALID, confidence 1)
    # Gate set chosen 2026-04-27 via exhaustive anchor-constrained search:
    #   - 847 combinations (1–7 gates from 10 metrics) evaluated
    #   - Only combos that perfectly separate all 19 anchor pairs kept (438 valid)
    #   - Best 4-gate combo on train: ATV + R3 + R5 + R7, with 1miss_ok scoring
    #     TP=80 FP=11 P=0.879 Sp=0.929 (vs. prior R6c+R3+R4+R7: TP=72 FP=11 P=0.867)
    #
    # Gates removed: bucket_temperature_ordering (R6c), sensor_spread_within_bucket (R4)
    # Gates added  : ambient_temperature_volatility (ATV), bucket_temporal_stability (R5)
    atv_mandatory: true             # ambient_temperature_volatility must pass
    r3_mandatory: true              # bucket_reference_adherence must pass (large.low strongest signal)
    r5_mandatory: true              # bucket_temporal_stability must pass (strong anchor separator)
    r7_mandatory: true              # bucket_diurnal_amplitude must pass (large.diurnal strongest signal)

    # valid_score thresholds — score is now over the 6 NON-GATE metrics:
    #   {R1(ambient_stability), R2(ambient_range), R4(sensor_spread_within_bucket),
    #    R6a(small_hive_ambient_tracking), R6b(large_hive_thermoregulation), R6c(bucket_temperature_ordering)}
    # With the new gates, conf-4 (1 miss ok) adds 8 TPs with ZERO extra FPs vs conf-5.
    score_confidence_5_min: 1.000   # 6/6 → confidence 5  (72 TP, 11 FP)
    score_confidence_4_min: 0.833   # 5/6 → confidence 4  (80 TP, 11 FP, one miss allowed)

# ── pred_rules — individual metric thresholds ─────────────────────────────────
# Calibrated on train split (299 pairs, 2026-05-18).
# All thresholds from precision ≥ 0.90 sweep; direction = lower unless noted.
pred_rules:

  clipping_pressure:
    # Used by pred_rule.py decision rule (PRIMARY signal = clip_diff_roll3).
    # Fallback (< 2 days history → roll3 unavailable): use clip_diff_mean ≤ 0.60.
    clip_diff_roll3: 0.591  # PRIMARY — 3-day rolling avg of mean |raw−clipped|
    clip_diff_mean:  0.60   # FALLBACK — today's mean when roll3 unavailable
    # Informational only (not used in decision):
    clip_diff_p90:   1.50
    pct_clipped:     0.64

  clip_diff_daily:
    # Daily (single-day) clipping-diff metrics.  Train performance at these thresholds:
    #   clip_diff_mean ≤ 0.83 → P=0.910 R=0.555 (101 TP, 10 FP)
    #   clip_diff_p90  ≤ 2.11 → P=0.902 R=0.604 (110 TP, 12 FP)  ← best recall
    #   clip_diff_max  ≤ 3.80 → P=0.923 R=0.198 ( 36 TP,  3 FP)
    clip_diff_mean: 0.83
    clip_diff_p90:  2.11
    clip_diff_max:  3.80

  clip_diff_rolling:
    # Rolling averages of daily clip_diff_mean.  Longer window → higher precision, lower recall.
    #   clip_diff_mean_roll3 ≤ 0.79 → P=0.901 R=0.432 (73 TP,  8 FP)
    #   clip_diff_mean_roll5 ≤ 0.64 → P=0.923 R=0.159 (24 TP,  2 FP)
    #   clip_diff_mean_roll7 ≤ 0.63 → P=0.905 R=0.137 (19 TP,  2 FP)
    clip_diff_mean_roll3: 0.79
    clip_diff_mean_roll5: 0.64
    clip_diff_mean_roll7: 0.63

  pct_clipped:
    # Fraction of sensors with |raw−clipped| > 0.01.  Rolling variants are near-perfect.
    #   pct_clipped       ≤ 0.711 → P=0.905 R=0.313 (57 TP,  6 FP)
    #   pct_clipped_roll3 ≤ 0.590 → P=1.000 R=0.030 ( 5 TP,  0 FP)
    #   pct_clipped_roll7 ≤ 0.670 → P=1.000 R=0.029 ( 4 TP,  0 FP)
    pct_clipped:       0.711
    pct_clipped_roll3: 0.590
    pct_clipped_roll7: 0.670

  pred_raw_stats:
    # Statistics on raw (unconstrained) model predictions.  Very low recall but high precision.
    #   pred_raw_std   ≤ 1.132 → P=1.000 R=0.022 (4 TP, 0 FP)  ← perfect precision
    #   pred_raw_range ≤ 8.311 → P=0.900 R=0.049 (9 TP, 1 FP)
    pred_raw_std:   1.132
    pred_raw_range: 8.311
